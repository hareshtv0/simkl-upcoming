name: Build upcoming calendar
on:
  schedule:
    - cron: "41 */6 * * *"      # every 6 hours (Simkl refreshes its calendar files every 6 hours)
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_TOKEN: ${{ secrets.SIMKL_TOKEN }}
        run: python3 upcoming.py site
      - uses: actions/upload-artifact@v4
        with:
          name: upcoming-site
          path: site
